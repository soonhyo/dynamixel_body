# Logical head angle <-> dynamixel_general_hw bridge configuration.
# Angles are radians.  Calibrate command_sign and joint_zero_rad on the real
# mannequin before enabling automatic head_reorient tasks.
joint_name: body_joint
command_sign: 1.0
joint_zero_rad: 0.0

limits:
  min_head_rad: -3.14159265359
  max_head_rad: 3.14159265359

trajectory_duration_s: 1.0
feedback_timeout_s: 1.0
require_fresh_feedback_before_command: true
# Reject out-of-range commands by default; silently saturating a head target
# can make the pipeline believe it is working on a different angular slice.
clamp_commands: false

topics:
  command: /hair_task_manager/head_rotation/command
  feedback: /hair_task_manager/head_rotation/feedback
  trajectory_command: /ros_body/position_joint_trajectory_controller/command
  joint_states: /ros_body/joint_states
